<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<rect width="1200" height="100%" rx="20" fill="#F3F7FC"/>
<text x="30" y="48" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-size="30" fill="#17324D">설명용 예제: 벽은 그대로, 로봇만 오른쪽으로</text>
<line x1="120" y1="220" x2="1100" y2="220" stroke="#7796B6" stroke-width="5"/>
<rect x="1050" y="100" width="40" height="150" rx="12" fill="#5B718C" stroke="#9CB3CD" stroke-width="2"/>
<text x="970" y="90" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-size="25" fill="#17324D">벽 3.0 m</text>
<rect x="260" y="150" width="110" height="65" rx="12" fill="#DDEAFF" stroke="#9CB3CD" stroke-width="2"/>
<text x="245" y="135" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-size="25" fill="#17324D">이동 전</text>
<text x="250" y="265" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-size="25" fill="#17324D">0.5 m</text>
<rect x="460" y="150" width="110" height="65" rx="12" fill="#DFF3E9" stroke="#9CB3CD" stroke-width="2"/>
<text x="450" y="135" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-size="25" fill="#17324D">이동 후</text>
<text x="450" y="265" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-size="25" fill="#17324D">0.7 m</text>
<text x="395" y="197" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-size="30" fill="#17324D">&gt;</text>
<line x1="565" y1="300" x2="1050" y2="300" stroke="#2D8D63" stroke-width="4"/>
<text x="675" y="341" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-size="26" fill="#17324D">이동 후 벽까지 2.3 m</text>
<text x="30" y="90" font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif" font-size="25" fill="#17324D">0.4 m/s로 0.5 s 이동 → 0.2 m만큼 전진</text>
</svg>